<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Unisole AI Scholar - Interactive Whiteboard</title>
  
  <!-- Local high-performance tldraw styling -->
  <link rel="stylesheet" href="/vendor/tldraw/tldraw.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    .tl-container {
      width: 100% !important;
      height: 100% !important;
      background: #0f172a !important;
    }
    #whiteboard-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 100;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #whiteboard-overlay-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.45);
      backdrop-filter: blur(10px);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }
    .wb-pacing-btn {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }
    .wb-pacing-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    #whiteboard-quick-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wb-action-btn {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .wb-action-btn:hover {
      background: rgba(30, 41, 59, 0.98);
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
    }

    /* Fallback Canvas (Instant fail-safe) */
    #fallback-canvas-container {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      z-index: 50;
    }
    #whiteboardFallbackCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Real-Time Live Diagnostics Panel */
    #whiteboard-diagnostic-panel {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-height: 220px;
      background: rgba(10, 15, 29, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      z-index: 2000;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    #diagnostic-header {
      padding: 6px 12px;
      background: rgba(30, 41, 59, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #38bdf8;
    }
    #diagnostic-content {
      padding: 8px 12px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .diag-entry {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      word-break: break-all;
    }
    .diag-entry.error {
      color: #fb7185;
      font-weight: bold;
    }
    .diag-entry.action {
      color: #34d399;
    }
    .diag-entry.info {
      color: #94a3b8;
    }

  </style>
</head>
<body>

  <!-- Instant Loading Overlay (Automatically fades out within 600ms) -->
  <div id="whiteboard-loading">
    <div class="spinner"></div>
    <div style="font-size: 0.9rem; font-weight: 600; color: #94a3b8;">Loading AI Interactive Whiteboard...</div>
  </div>

  <div id="whiteboard-overlay-badge">
    <div class="pulse-dot"></div>
    <span id="wbStatusText">👨‍🏫 Dr. Vikram Teaching: Visual Physical Model</span>
    <span id="wbPacingTimer" style="display:inline-block; font-size:0.7rem; background:rgba(56,189,248,0.22); border:1px solid rgba(56,189,248,0.5); padding:1px 6px; border-radius:10px; color:#38bdf8; font-weight:700;">10s</span>
    <div style="display:inline-flex; align-items:center; gap:4px; margin-left:4px;">
      <button type="button" class="wb-pacing-btn" id="btnPacePrev" onclick="window.wbPrevConcept()" title="Previous concept">◀</button>
      <button type="button" class="wb-pacing-btn" id="btnPaceToggle" onclick="window.wbTogglePacing()" title="Pause or Resume paced explanation">⏸ Pause</button>
      <button type="button" class="wb-pacing-btn" id="btnPaceNext" onclick="window.wbNextConcept()" title="Next concept">Next ▶</button>
      <button type="button" class="wb-pacing-btn" id="btnPaceAll" onclick="window.wbShowAllConcepts()" title="Show full board">Full Board</button>
    </div>
  </div>


  <div id="whiteboard-quick-actions">
    <button type="button" class="wb-action-btn" id="btnWbLogs" title="Toggle diagnostic logs">
      Diagnostics
    </button>
    <button type="button" class="wb-action-btn" id="btnWbClear" title="Clear whiteboard canvas">
      Clear Board
    </button>
    <button type="button" class="wb-action-btn" id="btnWbFit" title="Fit all shapes to view">
      Zoom Fit
    </button>
  </div>

  <!-- Primary tldraw Container -->
  <div id="root"></div>

  <!-- Fail-Safe High-Definition Canvas (Takes over seamlessly if needed) -->
  <div id="fallback-canvas-container">
    <canvas id="whiteboardFallbackCanvas"></canvas>
  </div>

  <!-- Real-Time Diagnostics Panel -->
  <div id="whiteboard-diagnostic-panel">
    <div id="diagnostic-header">
      <span>Real-Time Whiteboard Telemetry & Diagnostics</span>
      <div style="display: flex; gap: 8px;">
        <button type="button" style="background:transparent; border:none; color:#38bdf8; cursor:pointer; font-size:0.75rem;" onclick="copyDiagnosticLogs()">Copy</button>
        <button type="button" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:0.85rem;" onclick="toggleDiagnosticPanel()">✕</button>
      </div>
    </div>
    <div id="diagnostic-content"></div>
  </div>

  <script>
    const diagEntries = [];
    window.appendDiagnosticLog = function(event, data) {
      const time = new Date().toLocaleTimeString();
      const strData = typeof data === 'object' ? JSON.stringify(data) : String(data);
      diagEntries.push(`[${time}] ${event}: ${strData}`);
      
      const container = document.getElementById('diagnostic-content');
      if (container) {
        const div = document.createElement('div');
        div.className = 'diag-entry ' + (event.includes('ERROR') ? 'error' : (event.includes('ACTION') ? 'action' : 'info'));
        div.textContent = `[${time}] ${event} ${strData}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }
    };

    function toggleDiagnosticPanel() {
      const panel = document.getElementById('whiteboard-diagnostic-panel');
      if (!panel) return;
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

    function copyDiagnosticLogs() {
      navigator.clipboard.writeText(diagEntries.join('\n'));
      alert('Whiteboard diagnostic logs copied to clipboard!');
    }

    document.getElementById('btnWbLogs')?.addEventListener('click', toggleDiagnosticPanel);

    // Proactive IndexedDB purge to prevent schema mismatch crash
    try {
      if (typeof window !== 'undefined' && window.indexedDB && window.indexedDB.databases) {
        window.indexedDB.databases().then(function(dbs) {
          for (var i = 0; i < dbs.length; i++) {
            if (dbs[i].name && (dbs[i].name.indexOf('TLDRAW') !== -1 || dbs[i].name.indexOf('tldraw') !== -1)) {
              window.appendDiagnosticLog('PURGE_DB', dbs[i].name);
              window.indexedDB.deleteDatabase(dbs[i].name);
            }
          }
        });
      }
    } catch(e) {}

    // Global uncaught error telemetry
    window.addEventListener('error', function(e) {
      console.warn('[WHITEBOARD RESILIENCE] Caught error:', e.message);
      window.appendDiagnosticLog('WINDOW_ERROR', { message: e.message, filename: e.filename, lineno: e.lineno });
      fetch('/api/voice-tutor/whiteboard-logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'WINDOW_GLOBAL_ERROR',
          data: { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error?.stack }
        })
      }).catch(function() {});
      dismissSpinner();
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.warn('[WHITEBOARD UNHANDLED REJECTION]:', e.reason);
      window.appendDiagnosticLog('UNHANDLED_REJECTION', String(e.reason));
      fetch('/api/voice-tutor/whiteboard-logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'WINDOW_UNHANDLED_REJECTION',
          data: { reason: String(e.reason), stack: e.reason?.stack }
        })
      }).catch(function() {});
    });

    function dismissSpinner() {
      const loader = document.getElementById('whiteboard-loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 200);
      }
    }

    // Dismiss spinner unconditionally after 600ms so user is NEVER stuck on loading screen
    setTimeout(dismissSpinner, 600);

    // Fallback Canvas Implementation
    const fallbackContainer = document.getElementById('fallback-canvas-container');
    const fallbackCanvas = document.getElementById('whiteboardFallbackCanvas');
    let fbCtx = null;
    let fbYOffset = 60;

    window.initFallbackCanvas = function() {
      if (!fallbackCanvas) return;
      window.appendDiagnosticLog('INIT_FALLBACK_CANVAS', 'Engaging fallback 2D canvas');
      fallbackContainer.style.display = 'block';
      fallbackCanvas.width = window.innerWidth;
      fallbackCanvas.height = window.innerHeight;
      fbCtx = fallbackCanvas.getContext('2d');
      renderFallbackGrid();
      dismissSpinner();
    };

    function renderFallbackGrid() {
      if (!fbCtx) return;
      fbCtx.fillStyle = '#0f172a';
      fbCtx.fillRect(0, 0, fallbackCanvas.width, fallbackCanvas.height);
      fbCtx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      fbCtx.lineWidth = 1;
      for (let x = 0; x < fallbackCanvas.width; x += 30) {
        fbCtx.beginPath();
        fbCtx.moveTo(x, 0);
        fbCtx.lineTo(x, fallbackCanvas.height);
        fbCtx.stroke();
      }
      for (let y = 0; y < fallbackCanvas.height; y += 30) {
        fbCtx.beginPath();
        fbCtx.moveTo(0, y);
        fbCtx.lineTo(fallbackCanvas.width, y);
        fbCtx.stroke();
      }
    }

    window.clearFallbackCanvas = function() {
      if (!fbCtx) return;
      fbYOffset = 60;
      renderFallbackGrid();
    };

    window.drawFallbackHeader = function(title, chapter, marks) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;

      fbCtx.fillStyle = 'rgba(37, 99, 235, 0.2)';
      fbCtx.strokeStyle = '#38bdf8';
      fbCtx.lineWidth = 2;
      fbCtx.roundRect ? fbCtx.roundRect(60, fbYOffset, 700, 80, 8) : fbCtx.rect(60, fbYOffset, 700, 80);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = '#38bdf8';
      fbCtx.font = 'bold 12px sans-serif';
      fbCtx.fillText(`${(chapter || 'PHYSICS').toUpperCase()} (${marks || 3} MARKS)`, 75, fbYOffset + 24);

      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '14px sans-serif';
      const cleanT = (title || '').replace(/\$+/g, '').slice(0, 80);
      fbCtx.fillText(cleanT, 75, fbYOffset + 50);

      fbYOffset += 100;
    };

    window.drawFallbackDiagram = function(type, params) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;

      const cx = 410;
      const cy = fbYOffset + 90;

      // Optical Axis
      fbCtx.strokeStyle = '#64748b';
      fbCtx.setLineDash([6, 6]);
      fbCtx.beginPath();
      fbCtx.moveTo(60, cy);
      fbCtx.lineTo(760, cy);
      fbCtx.stroke();
      fbCtx.setLineDash([]);

      // Lens
      fbCtx.fillStyle = 'rgba(56, 189, 248, 0.25)';
      fbCtx.strokeStyle = '#38bdf8';
      fbCtx.lineWidth = 2;
      fbCtx.beginPath();
      fbCtx.ellipse(cx, cy, 18, 70, 0, 0, Math.PI * 2);
      fbCtx.fill();
      fbCtx.stroke();

      // Object
      fbCtx.strokeStyle = '#ef4444';
      fbCtx.lineWidth = 3;
      fbCtx.beginPath();
      fbCtx.moveTo(cx - 180, cy);
      fbCtx.lineTo(cx - 180, cy - 50);
      fbCtx.stroke();
      fbCtx.fillStyle = '#ef4444';
      fbCtx.font = '12px sans-serif';
      fbCtx.fillText('Object (h)', cx - 210, cy - 55);

      // Rays
      fbCtx.strokeStyle = '#eab308';
      fbCtx.lineWidth = 2;
      fbCtx.beginPath();
      fbCtx.moveTo(cx - 180, cy - 50);
      fbCtx.lineTo(cx, cy - 50);
      fbCtx.lineTo(cx + 180, cy + 50);
      fbCtx.stroke();

      // Image
      fbCtx.strokeStyle = '#10b981';
      fbCtx.lineWidth = 3;
      fbCtx.beginPath();
      fbCtx.moveTo(cx + 180, cy);
      fbCtx.lineTo(cx + 180, cy + 50);
      fbCtx.stroke();
      fbCtx.fillStyle = '#10b981';
      fbCtx.fillText('Image (Real, Inverted)', cx + 190, cy + 30);

      fbYOffset += 190;
    };

    window.drawFallbackStep = function(stepNum, title, formula, explanation) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;

      const lines = (formula || '').split('\n').filter(Boolean);
      const boxH = Math.max(85, 45 + lines.length * 20);

      fbCtx.fillStyle = stepNum === 1 ? 'rgba(234, 179, 8, 0.15)' : stepNum === 2 ? 'rgba(56, 189, 248, 0.15)' : 'rgba(168, 85, 247, 0.15)';
      fbCtx.strokeStyle = stepNum === 1 ? '#eab308' : stepNum === 2 ? '#38bdf8' : '#a855f7';
      fbCtx.lineWidth = 2;
      fbCtx.roundRect ? fbCtx.roundRect(60, fbYOffset, 700, boxH, 8) : fbCtx.rect(60, fbYOffset, 700, boxH);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = stepNum === 1 ? '#eab308' : stepNum === 2 ? '#38bdf8' : '#a855f7';
      fbCtx.font = 'bold 13px sans-serif';
      const cleanStepTitle = (title || '').replace(/^(step\s*\d+[\s.:-]*|\d+[\s.:-]*)/i, '').trim();
      fbCtx.fillText(cleanStepTitle || 'Mathematical Derivation', 75, fbYOffset + 24);

      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '13px monospace';
      lines.forEach((line, idx) => {
        fbCtx.fillText(line.replace(/\$+/g, ''), 75, fbYOffset + 48 + idx * 20);
      });

      fbYOffset += boxH + 20;
    };

    window.drawFallbackDoubt = function(doubtText, answerText) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;

      fbCtx.fillStyle = 'rgba(244, 63, 94, 0.2)';
      fbCtx.strokeStyle = '#fb7185';
      fbCtx.lineWidth = 2;
      fbCtx.roundRect ? fbCtx.roundRect(400, fbYOffset, 360, 80, 8) : fbCtx.rect(400, fbYOffset, 360, 80);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = '#fb7185';
      fbCtx.font = 'bold 12px sans-serif';
      fbCtx.fillText(`Student Doubt: "${(doubtText || '').slice(0, 35)}"`, 415, fbYOffset + 24);

      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '12px sans-serif';
      fbCtx.fillText(`${(answerText || '').slice(0, 45)}`, 415, fbYOffset + 50);

      fbYOffset += 100;
    };

    window.drawFallbackFinal = function(answer, keyInsight) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;

      fbCtx.fillStyle = 'rgba(16, 185, 129, 0.2)';
      fbCtx.strokeStyle = '#34d399';
      fbCtx.lineWidth = 2;
      fbCtx.roundRect ? fbCtx.roundRect(60, fbYOffset, 700, 70, 8) : fbCtx.rect(60, fbYOffset, 700, 70);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = '#34d399';
      fbCtx.font = 'bold 14px sans-serif';
      fbCtx.fillText(`FINAL ANSWER: ${(answer || '').replace(/\$+/g, '').slice(0, 70)}`, 75, fbYOffset + 30);

      fbCtx.fillStyle = '#94a3b8';
      fbCtx.font = '12px sans-serif';
      fbCtx.fillText(keyInsight || 'Verified by CBSE standard', 75, fbYOffset + 52);

      fbYOffset += 90;
    };

    window.drawFallbackSmartboardSolution = function(payload, activeConcept = null) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;
      window.clearFallbackCanvas();

      const q = payload?.questionHeader || {};
      const diag = payload?.diagram || {};
      const sol = payload?.solution || {};
      const s1 = sol.step1 || {};
      const s2 = sol.step2 || {};
      const s3 = sol.step3 || {};

      // Left Column (x: 50, w: 560): Question Header, Diagram, Tip
      // 1. Header Box
      fbCtx.fillStyle = 'rgba(30, 58, 138, 0.25)';
      fbCtx.strokeStyle = '#38bdf8';
      fbCtx.lineWidth = 2;
      fbCtx.roundRect ? fbCtx.roundRect(50, 40, 560, 110, 8) : fbCtx.rect(50, 40, 560, 110);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = '#38bdf8';
      fbCtx.font = 'bold 12px sans-serif';
      fbCtx.fillText(`QUESTION STATEMENT • ${q.marks || 3} MARKS | ${(q.chapter || 'SCIENCE').toUpperCase()}`, 65, 65);

      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '13px sans-serif';
      const cleanQ = (q.title || '').replace(/\$+/g, '');
      const words = cleanQ.split(' ');
      let line = '';
      let y = 90;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (fbCtx.measureText(testLine).width > 530 && n > 0) {
          fbCtx.fillText(line, 65, y);
          line = words[n] + ' ';
          y += 20;
          if (y > 135) break;
        } else {
          line = testLine;
        }
      }
      if (y <= 135) fbCtx.fillText(line, 65, y);

      // 2. Diagram Box
      fbCtx.fillStyle = 'rgba(15, 23, 42, 0.6)';
      fbCtx.strokeStyle = '#60a5fa';
      fbCtx.lineWidth = 1.5;
      fbCtx.roundRect ? fbCtx.roundRect(50, 165, 560, 310, 8) : fbCtx.rect(50, 165, 560, 310);
      fbCtx.fill();
      fbCtx.stroke();

      fbCtx.fillStyle = '#60a5fa';
      fbCtx.font = 'bold 12px sans-serif';
      fbCtx.fillText(`VISUAL SYSTEM SCHEMATIC • ${(diag.title || 'SYSTEM MODEL').toUpperCase()}`, 65, 190);

      // Schematic Flow
      fbCtx.strokeStyle = '#94a3b8';
      fbCtx.lineWidth = 2;
      fbCtx.strokeRect(90, 220, 200, 95);
      fbCtx.fillStyle = '#e2e8f0';
      fbCtx.font = '12px monospace';
      fbCtx.fillText('GIVEN PARAMETERS', 110, 255);
      fbCtx.fillText('SI Input Quantities', 110, 275);

      fbCtx.strokeStyle = '#eab308';
      fbCtx.beginPath();
      fbCtx.moveTo(290, 268);
      fbCtx.lineTo(350, 268);
      fbCtx.stroke();

      fbCtx.strokeStyle = '#34d399';
      fbCtx.strokeRect(350, 220, 200, 95);
      fbCtx.fillStyle = '#34d399';
      fbCtx.fillText('TARGET SOLUTION', 370, 255);
      fbCtx.fillText('Verified Result', 370, 275);

      fbCtx.strokeStyle = '#a855f7';
      fbCtx.strokeRect(90, 335, 460, 80);
      fbCtx.fillStyle = '#c084fc';
      fbCtx.fillText('CORE GOVERNING LAW & BOUNDARY CONDITIONS', 110, 370);

      // Helper to strip any numbered prefixes like "1. ", "Step 1: "
      const cleanCardTitle = (t, fallback) => (t || fallback).replace(/^(step\s*\d+[\s.:-]*|\d+[\s.:-]*)/i, '').trim().toUpperCase();

      // Right Column (x: 640, w: 600): Solution Sections (No artificial Step 1/2/3 labels)
      // Card 1: Governing Principles
      fbCtx.fillStyle = 'rgba(234, 179, 8, 0.12)';
      fbCtx.strokeStyle = '#eab308';
      fbCtx.lineWidth = 1.5;
      fbCtx.roundRect ? fbCtx.roundRect(640, 40, 600, 160, 8) : fbCtx.rect(640, 40, 600, 160);
      fbCtx.fill();
      fbCtx.stroke();
      fbCtx.fillStyle = '#eab308';
      fbCtx.font = 'bold 13px sans-serif';
      fbCtx.fillText(cleanCardTitle(s1.title, 'Governing Principles & Physical Setup'), 655, 65);
      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '12px monospace';
      const s1Lines = (s1.formula || '').replace(/\$+/g, '').split('\n').filter(Boolean);
      s1Lines.slice(0, 3).forEach((l, i) => fbCtx.fillText(l.slice(0, 75), 655, 90 + i * 20));
      fbCtx.fillStyle = '#cbd5e1';
      fbCtx.font = '11px sans-serif';
      fbCtx.fillText(`• ${(s1.explanation || '').replace(/\$+/g, '').slice(0, 80)}`, 655, 175);

      // Card 2: Mathematical Derivation & Algebraic Working
      fbCtx.fillStyle = 'rgba(56, 189, 248, 0.12)';
      fbCtx.strokeStyle = '#38bdf8';
      fbCtx.lineWidth = 1.5;
      fbCtx.roundRect ? fbCtx.roundRect(640, 215, 600, 180, 8) : fbCtx.rect(640, 215, 600, 180);
      fbCtx.fill();
      fbCtx.stroke();
      fbCtx.fillStyle = '#38bdf8';
      fbCtx.font = 'bold 13px sans-serif';
      fbCtx.fillText(cleanCardTitle(s2.title, 'Mathematical Derivation & Substitution'), 655, 240);
      fbCtx.fillStyle = '#f8fafc';
      fbCtx.font = '12px monospace';
      const s2Lines = (s2.formula || '').replace(/\$+/g, '').split('\n').filter(Boolean);
      s2Lines.slice(0, 4).forEach((l, i) => fbCtx.fillText(l.slice(0, 75), 655, 265 + i * 20));
      fbCtx.fillStyle = '#cbd5e1';
      fbCtx.font = '11px sans-serif';
      fbCtx.fillText(`• ${(s2.explanation || '').replace(/\$+/g, '').slice(0, 80)}`, 655, 375);

      // Card 3: Evaluated Result & Key Insight
      fbCtx.fillStyle = 'rgba(34, 197, 94, 0.14)';
      fbCtx.strokeStyle = '#22c55e';
      fbCtx.lineWidth = 1.5;
      fbCtx.roundRect ? fbCtx.roundRect(640, 410, 600, 155, 8) : fbCtx.rect(640, 410, 600, 155);
      fbCtx.fill();
      fbCtx.stroke();
      fbCtx.fillStyle = '#22c55e';
      fbCtx.font = 'bold 13px sans-serif';
      fbCtx.fillText(cleanCardTitle(s3.title, 'Evaluated Solution & Physical Takeaway'), 655, 435);
      fbCtx.fillStyle = '#86efac';
      fbCtx.font = 'bold 13px monospace';
      const s3Lines = (s3.formula || '').replace(/\$+/g, '').split('\n').filter(Boolean);
      s3Lines.slice(0, 2).forEach((l, i) => fbCtx.fillText(l.slice(0, 70), 655, 460 + i * 22));
      fbCtx.fillStyle = '#cbd5e1';
      fbCtx.font = '11px sans-serif';
      fbCtx.fillText(`Key Takeaway: ${(s3.explanation || '').replace(/\$+/g, '').slice(0, 85)}`, 655, 545);

      // Highlight active concept on fallback canvas if requested
      if (typeof activeConcept === 'number' && activeConcept >= 0 && activeConcept <= 3) {
        fbCtx.lineWidth = 3;
        fbCtx.setLineDash([8, 6]);
        if (activeConcept === 0) {
          fbCtx.strokeStyle = '#38bdf8';
          fbCtx.strokeRect(46, 161, 568, 318);
        } else if (activeConcept === 1) {
          fbCtx.strokeStyle = '#eab308';
          fbCtx.strokeRect(636, 36, 608, 168);
        } else if (activeConcept === 2) {
          fbCtx.strokeStyle = '#38bdf8';
          fbCtx.strokeRect(636, 211, 608, 188);
        } else if (activeConcept === 3) {
          fbCtx.strokeStyle = '#22c55e';
          fbCtx.strokeRect(636, 406, 608, 163);
        }
        fbCtx.setLineDash([]);
      }
    };

    window.clearFallbackRight = function() {
      if (!fbCtx) return;
      fbCtx.clearRect(400, 0, 480, 700);
      fbCtx.fillStyle = '#090d16';
      fbCtx.fillRect(400, 0, 480, 700);
    };

    window.setFallbackStepMode = function(payload) {
      if (!fbCtx) window.initFallbackCanvas();
      if (!fbCtx) return;
      const plan = payload?.plan || payload || {};
      window.clearFallbackCanvas();
      window.drawFallbackHeader(plan.questionHeader?.title, plan.questionHeader?.chapter, plan.questionHeader?.marks);
      window.drawFallbackDiagram('rolling_incline', plan.diagram);
    };

    // ============================================================================
    // TEACHER CONCEPT PACING & SPOTLIGHT CONTROLLER
    // ============================================================================
    const CONCEPT_DURATIONS = [10, 12, 14, 10]; // Visual Model (10s), Governing Laws (12s), Derivation (14s), Result (10s)
    let currentConceptIndex = 0;
    let pacingSecondsLeft = 10;
    let pacingInterval = null;
    let isPacingPaused = false;
    let cachedSmartboardPayload = null;

    window.startPacedConceptTeaching = function(payload = null) {
      if (payload) cachedSmartboardPayload = payload;
      clearInterval(pacingInterval);
      currentConceptIndex = 0;
      isPacingPaused = false;
      pacingSecondsLeft = CONCEPT_DURATIONS[0];
      updatePacingUI();
      triggerSpotlight(0);

      pacingInterval = setInterval(() => {
        if (isPacingPaused) return;
        pacingSecondsLeft--;
        if (pacingSecondsLeft <= 0) {
          if (currentConceptIndex < 3) {
            currentConceptIndex++;
            pacingSecondsLeft = CONCEPT_DURATIONS[currentConceptIndex];
            triggerSpotlight(currentConceptIndex);
          } else {
            // Reached completion (Full Board)
            clearInterval(pacingInterval);
            currentConceptIndex = 4;
            triggerSpotlight(4);
            const statusEl = document.getElementById('wbStatusText');
            if (statusEl) statusEl.textContent = '✅ Full Lesson Complete • Ask Any Doubt Live!';
            const timerEl = document.getElementById('wbPacingTimer');
            if (timerEl) timerEl.style.display = 'none';
            const toggleBtn = document.getElementById('btnPaceToggle');
            if (toggleBtn) toggleBtn.innerHTML = '↺ Replay';
            return;
          }
        }
        updatePacingUI();
      }, 1000);
    };

    function updatePacingUI() {
      const titles = [
        'Visual Physical Model & Coordinates',
        'Governing Physical Principles & Laws',
        'Mathematical Derivation & Working',
        'Evaluated Solution & Exam Takeaway',
        'Full Board Complete'
      ];
      const statusEl = document.getElementById('wbStatusText');
      if (statusEl) {
        if (isPacingPaused) {
          statusEl.textContent = `⏸ Paused: ${titles[currentConceptIndex] || 'Smartboard'}`;
        } else if (currentConceptIndex <= 3) {
          statusEl.textContent = `👨‍🏫 Dr. Vikram Teaching: ${titles[currentConceptIndex]}`;
        } else {
          statusEl.textContent = '✅ Full Lesson Complete • Ask Any Doubt Live!';
        }
      }

      const timerEl = document.getElementById('wbPacingTimer');
      if (timerEl) {
        if (currentConceptIndex <= 3) {
          timerEl.style.display = 'inline-block';
          timerEl.textContent = `${pacingSecondsLeft}s`;
        } else {
          timerEl.style.display = 'none';
        }
      }

      const toggleBtn = document.getElementById('btnPaceToggle');
      if (toggleBtn) {
        if (currentConceptIndex === 4) {
          toggleBtn.innerHTML = '↺ Replay';
        } else {
          toggleBtn.innerHTML = isPacingPaused ? '▶ Play' : '⏸ Pause';
        }
      }
    }

    function triggerSpotlight(index) {
      if (window.whiteboardController?.spotlightConcept) {
        window.whiteboardController.spotlightConcept(index);
      }
      if (window.drawFallbackSmartboardSolution && cachedSmartboardPayload) {
        window.drawFallbackSmartboardSolution(cachedSmartboardPayload, index);
      }
      try {
        window.parent.postMessage({
          type: 'WB_CONCEPT_CHANGED',
          conceptIndex: index,
          secondsLeft: pacingSecondsLeft
        }, '*');
      } catch (e) {}
    }

    window.wbTogglePacing = function() {
      if (currentConceptIndex === 4) {
        window.startPacedConceptTeaching();
        return;
      }
      isPacingPaused = !isPacingPaused;
      updatePacingUI();
    };

    window.wbNextConcept = function() {
      if (currentConceptIndex < 3) {
        currentConceptIndex++;
      } else {
        currentConceptIndex = 4;
      }
      pacingSecondsLeft = CONCEPT_DURATIONS[currentConceptIndex] || 8;
      triggerSpotlight(currentConceptIndex);
      updatePacingUI();
    };

    window.wbPrevConcept = function() {
      if (currentConceptIndex > 0) {
        currentConceptIndex--;
      } else {
        currentConceptIndex = 0;
      }
      pacingSecondsLeft = CONCEPT_DURATIONS[currentConceptIndex] || 8;
      triggerSpotlight(currentConceptIndex);
      updatePacingUI();
    };

    window.wbShowAllConcepts = function() {
      clearInterval(pacingInterval);
      currentConceptIndex = 4;
      triggerSpotlight(4);
      const timerEl = document.getElementById('wbPacingTimer');
      if (timerEl) timerEl.style.display = 'none';
      const statusEl = document.getElementById('wbStatusText');
      if (statusEl) statusEl.textContent = '👨‍🏫 Smartboard: Full Solution Displayed';
      const toggleBtn = document.getElementById('btnPaceToggle');
      if (toggleBtn) toggleBtn.innerHTML = '↺ Replay';
    };

    // Global step controller
    window.currentWhiteboardStep = 0;
    window.updateUIProgress = function(step, statusText) {
      window.currentWhiteboardStep = step;
      if (statusText) {
        const textEl = document.getElementById('wbStatusText');
        if (textEl) textEl.textContent = statusText;
      }
    };

    window.wbChangeStep = function(step) {
      window.currentWhiteboardStep = step;
      triggerSpotlight(step);
    };

    window.wbNextStep = function() {
      window.wbNextConcept();
    };

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === 'START_PACING') {
        window.startPacedConceptTeaching(msg.payload);
      } else if (msg.type === 'PAUSE_PACING') {
        isPacingPaused = true;
        updatePacingUI();
      } else if (msg.type === 'RESUME_PACING') {
        isPacingPaused = false;
        updatePacingUI();
      } else if (msg.type === 'SPOTLIGHT_CONCEPT') {
        triggerSpotlight(typeof msg.payload?.conceptIndex === 'number' ? msg.payload.conceptIndex : msg.payload);
      }
    });
  </script>
